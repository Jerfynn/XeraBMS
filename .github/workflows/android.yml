name: Build XeraBMS APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.XERA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > keystore/release.jks
            echo "Release keystore restored"
          else
            echo "No keystore secret – release APK will be signed with the debug key"
          fi

      - name: Unit tests (protocol parsers)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build APKs
        env:
          XERA_KEYSTORE_PASSWORD: ${{ secrets.XERA_KEYSTORE_PASSWORD }}
          XERA_KEY_ALIAS: ${{ secrets.XERA_KEY_ALIAS }}
          XERA_KEY_PASSWORD: ${{ secrets.XERA_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/XeraBMS-${GITHUB_RUN_NUMBER}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/XeraBMS-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: XeraBMS-apk
          path: dist/*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
